# F19 — CI gate: the same four checks the deploy script relies on, on every push / PR.
# Runs against a throw-away Postgres 17 so the e2e suite (306 HTTP checks as of the Day 2
# final security correction) is real, not mocked.
#
# 2026-11-02 (NG-S11, Day 2): CI e2e was failing because the backup/DR section (B + S16)
# needs a backup store, which the CI env did not provide. CI now generates a throwaway
# BACKUP_KEY and uses a local BACKUP_DIR, so the backup cron, file verify, full restore
# drill and document-level drill all execute in CI. CAVEAT: RETENTION_POLICY=demo and the
# throwaway keys are CI config for a synthetic throwaway env — they must NEVER be blindly
# copied into production deployment config (see
# web/docs/operations/GITHUB_CI_AND_BRANCH_PROTECTION.md).
#
# 2026-11-02 (NG-S11, Day 2): least-privilege token (contents: read) + both third-party
# actions pinned to immutable commit SHAs (official actions, no others used).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: citycare, POSTGRES_PASSWORD: citycare, POSTGRES_DB: citycare }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U citycare" --health-interval 5s --health-timeout 5s --health-retries 12
    defaults: { run: { working-directory: web } }
    env:
      DATABASE_URL: postgres://citycare:citycare@127.0.0.1:5432/citycare
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-0123456789
      CRON_SECRET: ci-cron-secret
      ANCHOR_OTS: "0"           # never call public calendars from CI
      TZ_POLICY: Asia/Kolkata
      RETENTION_POLICY: demo  # CI is a demo-equivalent throwaway env; the S15 e2e checks assert the armed sweep + matching notice copy
      SEED_CONTEXT: ci  # R1 review F3: CI's seed runs are the isolated CI seeding workflow — the declared context (a direct run without this declaration can never seed)
      BACKUP_DIR: /tmp/ci-backups  # throwaway local backup store for the e2e B/S16 backup + restore-drill checks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: generate CI-only keys (document encryption + anchor signing + backup encryption)
        run: |
          echo "DOCUMENT_KEY=$(node -e 'console.log(require("crypto").randomBytes(32).toString("base64"))')" >> "$GITHUB_ENV"
          echo "ANCHOR_SIGNING_KEY=$(node -e 'const {privateKey}=require("crypto").generateKeyPairSync("ed25519");console.log(privateKey.export({format:"der",type:"pkcs8"}).toString("base64"))')" >> "$GITHUB_ENV"
          echo "BACKUP_KEY=$(node -e 'console.log(require("crypto").randomBytes(32).toString("base64"))')" >> "$GITHUB_ENV"
      - run: npx eslint .
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - run: node scripts/licenses.mjs
      - name: schema + demo data
        run: sudo apt-get install -y -qq postgresql-client && FORCE_SEED=1 bash scripts/db-bootstrap.sh && mkdir -p "$BACKUP_DIR"
      # R1 (2026-11-02, P0 isolation remediation): the prebuild target gate is FAIL-CLOSED
      # — an environment that does not explicitly declare itself (VERCEL_ENV) can never run
      # database bootstrap/migrations. CI declares itself an explicit development environment
      # for the build step and removes DATABASE_URL from that step, so the build performs NO
      # database work. The database for the e2e job is prepared ONLY by the explicit
      # "schema + demo data" step above (a direct, isolated bootstrap of the throwaway
      # CI Postgres), never by the build hook.
      - name: build (no automatic DB work — explicit VERCEL_ENV, no DATABASE_URL on this step)
        env:
          VERCEL_ENV: development
          DATABASE_URL: ""
        run: npx next build
      - name: e2e (HTTP, against the built app)
        # Failure reporting: the e2e suite streams its own summary + full failure list to
        # this job log; on failure the last 200 app-server log lines are appended for
        # server-side context. No secrets are ever written to the log (all keys are
        # generated per-run and never echoed).
        run: |
          (npx next start -H 127.0.0.1 -p 3000 > /tmp/next.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/health > /dev/null && break; sleep 1; done
          node scripts/e2e.mjs || { echo "--- app log (last 200 lines) ---"; tail -200 /tmp/next.log; exit 1; }
