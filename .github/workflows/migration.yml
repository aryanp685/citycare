# R1 review F1 (2026-11-02) — the PROTECTED controlled migration operation.
#
# This is the ONLY supported way to move the production schema:
#   * manual dispatch only (workflow_dispatch) — never triggered by push/PR;
#   * runs in the `production` GitHub environment — the owner configures REQUIRED
#     REVIEWERS on that environment (repo → settings → environments) so a human
#     approves every run before a single DDL statement;
#   * explicit inputs: the 40-hex commit SHA being released + the NEWEST migration
#     filename in that commit (both validated before any connection);
#   * the migration destination is MIGRATION_DATABASE_URL — a GitHub secret that is
#     NOT a Vercel build variable (owner-created; later R7: a least-privilege
#     DDL-capable role). The destination URL is validated independently and only
#     its HOST is ever logged.
#
# Normal Vercel production builds are PERMANENTLY verify-only: the prebuild gate
# refuses apply inside a Vercel build (VERCEL_PROJECT_ID/VERCEL_GIT_COMMIT_SHA
# markers) — see web/src/lib/prebuild-gate-core.mjs. Runbook:
# web/docs/operations/DEMO_AND_PILOT_ENVIRONMENT_ISOLATION.md §7.2.
name: migration
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-hex commit SHA whose schema/migrations/ is to be applied (the commit being released to production)"
        required: true
        type: string
      migration_target:
        description: "The NEWEST migration filename in that commit (NNNN_snake_name.sql)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: migration-production
  cancel-in-progress: false
jobs:
  apply-migrations:
    runs-on: ubuntu-latest
    # OWNER ACTION (one-time): create the `production` environment with REQUIRED
    # REVIEWERS (repo → settings → environments). Until then this job is still
    # manual-only — it cannot be triggered by any push/PR.
    environment: production
    timeout-minutes: 30
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.commit_sha }}
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: validate the controlled operation (explicit commit + newest target + destination, fail closed)
        env:
          MIGRATION_WORKFLOW_COMMIT_SHA: ${{ github.event.inputs.commit_sha }}
          MIGRATION_TARGET: ${{ github.event.inputs.migration_target }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: node scripts/migration-validate-node.mjs
      - name: apply migrations (the controlled DDL operation — the run log is the audit record)
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_TARGET: ${{ github.event.inputs.migration_target }}
          RETENTION_POLICY: demo
          SEED_DEMO: "0"          # a production run never seeds — the gate skips (and would refuse anything else)
          SEED_CONTEXT: ci        # declared isolated context for the seed phase (F3); SEED_DEMO=0 makes it a no-op
        run: node scripts/db-bootstrap-node.mjs
      - name: verify the production schema (read-only, against the same destination)
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: node scripts/db-verify-node.mjs
